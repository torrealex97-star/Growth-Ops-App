name: CI

# Quality gate: nada de esto existía antes (el único workflow era deploy.yml, manual y sin
# ningún check previo). Corre en cada push y PR. Los checks baratos (format/lint/typecheck)
# van primero y en paralelo con los tests; build solo arranca si esos pasan, para no gastar
# minutos de CI compilando código que ya se sabe roto.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Typecheck · Dead code · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ejecuta imports TypeScript en los tests nativos y coincide con
          # el runtime local/Vercel usado para validar este repositorio.
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - name: Typecheck
        run: npm run typecheck
        env:
          # El runner estándar se queda sin memoria con la carga actual de tipos.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run dead-code
      - name: Unit tests (incluye invariante multitenant contra el esquema vivo)
        run: npm test
        env:
          # Secrets de SOLO LECTURA: el test del invariante consulta el OpenAPI de PostgREST
          # para verificar que ninguna tabla puede nacer fuera de una subcuenta, y que el
          # artefacto lib/types/database-generated.ts no se ha quedado viejo. Sin secrets el
          # test se salta (la ausencia de env no es una violación).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npm run test:metrics

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (con placeholders de env — no toca Supabase real)
        run: npm run build
        env:
          # La fase de recopilación/prerender también supera el heap V8 por defecto
          # en GitHub Actions, aunque el mismo build termina en local y Vercel.
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Repo PÚBLICO: el historial es legible por cualquiera, así que un secreto filtrado es
  # compromiso inmediato. Escaneo de TODOS los commits en cada push/PR. --redact es fijo:
  # si algún día detecta algo, el log del job nunca imprime el valor. Config en .gitleaks.toml
  # (reglas por defecto + allowlist POR VALOR de los fixtures falsos de test).
  gitleaks:
    name: Secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo, no solo el último commit
      - name: Descargar gitleaks (versión fijada)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
      - name: Escanear secretos (--redact: nunca imprime valores)
        run: ./gitleaks detect --source . --log-opts="--all" --redact --config .gitleaks.toml
