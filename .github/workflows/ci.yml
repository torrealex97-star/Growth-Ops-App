name: CI

# Quality gate: nada de esto existía antes. El despliegue lo hace la integración nativa de Vercel
# con el repo (cada PR recibe su preview y main va a producción). Los checks baratos (format/lint/typecheck) van primero y en paralelo
# con los tests; build solo arranca si esos pasan, para no gastar minutos de CI compilando
# código que ya se sabe roto.
#
# ALCANCE (el repo es PÚBLICO: los runners no consumen cuota, así que esto NO es por minutos. Se
# mantiene porque evita runs redundantes y la cola de checks en ramas sin PR — A0 §2.3):
#   · Solo pushes a main y PRs — antes corría en TODAS las ramas y cada push repetía todo.
#   · paths-ignore en push: cambios solo de docs/markdown/.freebuff no disparan CI.
#   · pull_request SIN paths-ignore (obligatorio): con branch protection, los required
#     checks deben existir en TODO PR — un PR de solo docs sin run quedaría bloqueado
#     para siempre (mergeable_state "blocked" sin checks que esperear).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.freebuff/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Typecheck · Dead code · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ejecuta imports TypeScript en los tests nativos y coincide con
          # el runtime local/Vercel usado para validar este repositorio.
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - name: Typecheck
        run: npm run typecheck
        env:
          # El runner estándar se queda sin memoria con la carga actual de tipos.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run dead-code
      - name: Unit tests (incluye invariante multitenant contra el esquema vivo)
        run: npm test
        env:
          # Secrets de SOLO LECTURA: el test del invariante consulta el OpenAPI de PostgREST
          # para verificar que ninguna tabla puede nacer fuera de una subcuenta, y que el
          # artefacto lib/types/database-generated.ts no se ha quedado viejo. Sin secrets el
          # test se salta (la ausencia de env no es una violación).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npm run test:metrics

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (con placeholders de env — no toca Supabase real)
        run: npm run build
        env:
          # La fase de recopilación/prerender también supera el heap V8 por defecto
          # en GitHub Actions, aunque el mismo build termina en local y Vercel.
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # SMOKE E2E (Playwright): los flujos críticos de negocio no se rompen sin que nos demos cuenta.
  # Reservas (alta manual end-to-end) y ficha de contacto (info-first + campos personalizados)
  # contra el Supabase real con un tenant QA dedicado (qa-e2e), nunca con datos de clientes.
  # Después de quality: no gastar minutos E2E si el código ya se sabe roto por otra vía.
  e2e:
    name: Smoke E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    # Los jobs E2E comparten el MISMO tenant QA (qa-e2e) en el MISMO Supabase: dos suites en
    # paralelo se pisan (la limpieza/rotación de credenciales de la una invalida la sesión
    # del storageState de la otra a mitad de suite). Se serializan por grupo de concurrencia;
    # cancel-in-progress porque el run más nuevo ya valida el mismo árbol.
    concurrency:
      group: e2e-tenant-qa
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Build con env público REAL
        run: npm run build
        env:
          # Next inlinea las NEXT_PUBLIC_* en el bundle del cliente EN BUILD-TIME: con placeholders
          # el navegador del E2E no alcanzaría Supabase. La anon key es pública por diseño.
          # El service-role es server-only: placeholder vale para el build (el runtime del server
          # usa el secret real que inyecta el step siguiente).
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - name: Smoke E2E (build + start + specs; Playwright levanta el server)
        run: npm run test:e2e
        env:
          # Supabase real (mismas credenciales que consumen los unit tests del invariante).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Password del usuario QA admin@qa-e2e.test — solo el secret, nunca en el repo.
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_TELEMETRY_DISABLED: 1
      - name: Subir artefactos si falla (vídeo + traza + capturas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          # Los vídeos (webm) y la traza viven aquí: Playwright retiene SOLO los de tests
          # fallidos (outputDir conserva lo suyo y delete-results-on-exit borra el resto).
          path: test-results/e2e-artifacts
          retention-days: 7

  # Repo PÚBLICO: el historial es legible por cualquiera, así que un secreto filtrado es
  # compromiso inmediato. Escaneo de TODOS los commits en cada push/PR. --redact es fijo:
  # si algún día detecta algo, el log del job nunca imprime el valor. Config en .gitleaks.toml
  # (reglas por defecto + allowlist POR VALOR de los fixtures falsos de test).
  gitleaks:
    name: Secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo, no solo el último commit
      - name: Descargar gitleaks (versión fijada)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
      - name: 'Escanear secretos (--redact: nunca imprime valores)'
        run: ./gitleaks detect --source . --log-opts="--all" --redact --config .gitleaks.toml
