name: Deploy to Vercel

# Auto-deploy sin la integración nativa Vercel↔GitHub (que no se pudo activar por el
# reparto de cuentas). Usa el token de Vercel guardado en Secrets:
#   - push a main    -> despliega a PRODUCCIÓN ([tenant]), env vars de Production
#   - push a staging -> despliega un PREVIEW, env vars de Preview (Supabase staging)
# Activación manual hasta configurar VERCEL_TOKEN, VERCEL_ORG_ID y
# VERCEL_PROJECT_ID en GitHub Actions.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Desplegar
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "→ Producción"
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "→ Preview (${{ github.ref_name }})"
            vercel deploy --yes --token="$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
